name: Deploy Release Status Dashboard

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Testing dependencies
        run: npm test                       #Maybe we can do something like try{} except{ rollback(); } kinda logic here?

      - name: Deploy application
        run: ./deploy.sh